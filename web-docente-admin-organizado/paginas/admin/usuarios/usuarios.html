<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios · Panel de Control</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../../../assets/css/design.css">
    <link rel="stylesheet" href="../admin.css">
    <link rel="stylesheet" href="../table.css">
    <link rel="stylesheet" href="../dashboard/dashboard.css">
</head>
<body class="admin-body">

    <header class="admin-topbar">
        <div class="admin-topbar-inner">
            <div class="admin-marca">
                <img src="../../../assets/images/Integra-net.jpg" alt="Integra-net">
                <div>
                    <strong>Panel de Administración</strong>
                    <span>Supervisión general del sistema</span>
                </div>
            </div>
            <nav class="admin-nav">
                <button type="button" class="admin-nav-btn" data-admin-nav="../dashboard/dashboard.html">
                    <i class="fa-solid fa-gauge-high"></i> Resumen
                </button>
                <button type="button" class="admin-nav-btn" data-admin-nav="../tareas/tareas.html">
                    <i class="fa-solid fa-list-check"></i> Tareas
                </button>
                <button type="button" class="admin-nav-btn is-active" data-admin-nav="usuarios.html">
                    <i class="fa-solid fa-users"></i> Usuarios
                </button>
                <button type="button" class="admin-nav-btn" id="btnCerrarSesion">
                    <i class="fa-solid fa-right-from-bracket"></i> Salir
                </button>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="admin-header">
            <h2 class="admin-title">Usuarios del sistema</h2>
            <p class="admin-subtitle">Docentes, administradores y estudiantes registrados</p>
        </div>

        <div class="filtros">
            <input type="search" id="buscarUsuario" placeholder="Buscar por nombre o correo…" aria-label="Buscar usuario">
            <select id="filtroRol" aria-label="Filtrar por rol">
                <option value="">Todos los roles</option>
                <option value="admin">Administrador</option>
                <option value="docente">Docente</option>
                <option value="estudiante">Estudiante</option>
            </select>
        </div>

        <div id="tabla-usuarios"></div>
    </main>

    <script src="../../../assets/js/auth.js"></script>
    <script src="../../../assets/js/perfil/datosIniciales.js"></script>
    <script src="../table.js"></script>
    <script src="usuarios.js"></script>
    <script>
        document.getElementById('btnCerrarSesion').addEventListener('click', () => {
            localStorage.removeItem('eduSesion');
            localStorage.removeItem('usuarioActual');
            localStorage.removeItem('sesionActiva');
            window.location.href = '../../auth/login.html';
        });
        document.querySelectorAll('[data-admin-nav]').forEach(btn => {
            btn.addEventListener('click', () => { window.location.href = btn.dataset.adminNav; });
        });
    </script>
</body>
</html>
