<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control · Integra-net</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/design.css">
    <link rel="stylesheet" href="../admin.css">
    <link rel="stylesheet" href="../table.css">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body class="admin-body">

    <header class="admin-topbar">
        <div class="admin-topbar-inner">
            <div class="admin-marca">
                <img src="../../../assets/images/Integra-net.jpg" alt="Integra-net">
                <div>
                    <strong>Panel de Administración</strong>
                    <span>Supervisión general del sistema</span>
                </div>
            </div>
            <nav class="admin-nav">
                <button type="button" class="admin-nav-btn is-active" data-admin-nav="dashboard.html">
                    <i class="fa-solid fa-gauge-high"></i> Resumen
                </button>
                <button type="button" class="admin-nav-btn" data-admin-nav="../tareas/tareas.html">
                    <i class="fa-solid fa-list-check"></i> Tareas
                </button>
                <button type="button" class="admin-nav-btn" data-admin-nav="../usuarios/usuarios.html">
                    <i class="fa-solid fa-users"></i> Usuarios
                </button>
                <button type="button" class="admin-nav-btn" id="btnCerrarSesion">
                    <i class="fa-solid fa-right-from-bracket"></i> Salir
                </button>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="admin-header">
            <h2 class="admin-title">Resumen del sistema</h2>
            <p class="admin-subtitle">Estudiantes, docentes, tareas y evaluaciones de todo el sistema</p>
        </div>

        <section class="row" id="stats-container">
            <p class="vacio">Cargando…</p>
        </section>

        <div class="row">
            <div class="col">
                <div class="card">
                    <div class="card-header"><i class="fa-solid fa-list-check"></i> Tareas pendientes</div>
                    <div id="next-tareas"></div>
                </div>
            </div>
            <div class="col">
                <div class="card">
                    <div class="card-header"><i class="fa-solid fa-clipboard-list"></i> Evaluaciones por módulo</div>
                    <div id="recent-activities"></div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col">
                <div class="card">
                    <div class="card-header"><i class="fa-solid fa-chalkboard-user"></i> Docentes registrados</div>
                    <div id="docentes-list"></div>
                </div>
            </div>
            <div class="col">
                <div class="card">
                    <div class="card-header"><i class="fa-solid fa-file-circle-check"></i> Entregas</div>
                    <div id="entregas-resumen"></div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header"><i class="fa-solid fa-chart-column"></i> Asistencia por módulo</div>
            <div class="card-body">
                <canvas id="chartAsistenciaAdmin" height="240"></canvas>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="../../../assets/js/auth.js"></script>
    <script src="../../../assets/js/perfil/datosIniciales.js"></script>
    <script src="dashboard.js"></script>
    <script>
        document.getElementById('btnCerrarSesion').addEventListener('click', () => {
            localStorage.removeItem('eduSesion');
            localStorage.removeItem('usuarioActual');
            localStorage.removeItem('sesionActiva');
            window.location.href = '../auth/login.html';
        });
    </script>
</body>
</html>
