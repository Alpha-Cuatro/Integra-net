<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integra-net | Iniciar Sesión</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/design.css">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <img src="../../assets/images/Fondo login.jpeg" alt="Integra-net fondo" class = "fondo-login">

    <div class="login-container">

        <img src="" alt="">
        <div class="login-card ribbon-accent">

            <div class="logo-section">
                <img src="../../assets/images/Integra-net.jpg" alt="Integra-net logo" class="logo">
                <h1>Integra-net</h1>
                <p>Aprende, participa y crece.</p>
            </div>

            <form id="loginForm">

                <div class="input-group">
                    <i class="fa-solid fa-envelope"></i>
                    <input
                        type="email"
                        id="email"
                        placeholder="Correo electrónico"
                        required>
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-lock icon-left"></i>

                    <input
                        type="password"
                        id="password"
                        placeholder="Contraseña"
                        required>

                    <button
                        type="button"
                        id="togglePassword"
                        class="toggle-password">

                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
                <button type="submit" class="btn-login">
                    Iniciar Sesión
                </button>

            </form>

            <div class="extra-links">
                <a href="#" id="linkRecuperar">¿Olvidaste tu contraseña?</a>

                <p>
                    ¿No tienes cuenta?
                    <a href="./signup.html">
                        Crear cuenta
                    </a>
                </p>
            </div>

        </div>
        <div id="modalMensaje" class="modal-mensaje">
            <div class="modal-contenido">
                <div id="iconoMensaje" class="icono">
                    <i class="fa-solid fa-circle-info"></i>
                </div>

                <h2 id="tituloMensaje">Mensaje</h2>

                <p id="textoMensaje">
                    Aquí aparecerá el mensaje.
                </p>

                <div class="botones-modal">
                    <button id="btnRegistro" class="btn-registro" style="display:none;">Registrarme</button>
                    <button id="btnRecuperar" class="btn-registro" style="display:none;background:#f59e0b;">Recuperar</button>
                    <button id="btnCerrar" class="btn-cerrar">Entendido</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../../assets/js/auth.js"></script>
    <div id="recuperarOverlay" class="modal-mensaje" style="display:none;">
        <div class="modal-contenido">
            <div class="icono"><i class="fa-solid fa-key"></i></div>
            <h2>Recuperar Contraseña</h2>
            <form id="recuperarForm">
                <div class="input-group" style="margin:20px 0;">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="recuperarEmail" placeholder="Tu correo electrónico" required style="width:100%;height:55px;padding-left:50px;border:1px solid #e2e8f0;border-radius:14px;font-size:15px;">
                </div>
                <div class="botones-modal">
                    <button type="button" id="recuperarCancelar" class="btn-cerrar">Cancelar</button>
                    <button type="submit" class="btn-registro">Recuperar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="login.js"></script>

</body>

</html>
